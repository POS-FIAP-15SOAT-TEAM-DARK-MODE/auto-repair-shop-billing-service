openapi: 3.0.3
info:
  title: Auto Repair Shop - Billing Service
  version: 1.0.0
  description: Budgets and payments of service orders. Monetary values are decimal strings (e.g. "221.00").
servers:
  - url: http://localhost:8083
security:
  - bearerAuth: []
paths:
  /ping:
    get:
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string, example: pong}
  /metrics:
    get:
      summary: Prometheus metrics
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text format
          content:
            text/plain:
              schema: {type: string}
  /v1/budgets/{serviceOrderId}:
    get:
      summary: Get the budget of a service order
      description: Attendant, mechanic and admin see any budget; a customer sees only its own (other customers get 404).
      parameters:
        - name: serviceOrderId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Budget
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Budget'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /v1/payments/{serviceOrderId}:
    get:
      summary: Get the most recent payment of a service order
      description: Attendant and admin.
      parameters:
        - name: serviceOrderId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /v1/payments/{id}/confirm:
    post:
      summary: Approve a PENDING payment (emits PaymentApproved)
      description: Attendant and admin.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: X-Request-Id
          in: header
          required: false
          description: Copied to the emitted event. Generated when absent.
          schema: {type: string}
      responses:
        '204': {description: Approved}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /v1/payments/{id}/reject:
    post:
      summary: Reject a PENDING payment (emits PaymentFailed with reason PAYMENT_REJECTED)
      description: Attendant and admin.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: X-Request-Id
          in: header
          required: false
          description: Copied to the emitted event. Generated when absent.
          schema: {type: string}
      responses:
        '204': {description: Rejected}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/webhooks/mercadopago:
    post:
      summary: Mercado Pago payment notification
      description: Public; authenticated by the `x-signature` header.
      security: []
      parameters:
        - name: data.id
          in: query
          required: true
          schema: {type: string, example: "186237542593"}
        - name: type
          in: query
          required: false
          schema: {type: string, example: payment}
        - name: x-signature
          in: header
          required: true
          description: "ts=<milliseconds>,v1=<hex HMAC-SHA256 of id:<data.id>;request-id:<x-request-id>;ts:<ts>;>"
          schema: {type: string}
        - name: x-request-id
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type: {type: string, example: payment}
                action: {type: string, example: payment.updated}
                data:
                  type: object
                  properties:
                    id: {type: string, example: "186237542593"}
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: {type: string, enum: [applied, duplicate, ignored, unknown]}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: >
        Error body. Middleware errors (401, 403) and handler errors (404, 409, 500) carry `code` and `error`.
        `errors` is used for input validation (400) and is omitted otherwise.
      content:
        application/json:
          schema:
            type: object
            properties:
              code: {type: integer, example: 404}
              error: {type: string, example: "budget not found"}
              errors:
                type: array
                items: {type: string}
  schemas:
    BudgetItem:
      type: object
      properties:
        kind: {type: string, enum: [WORK, SUPPLY]}
        ref_id: {type: string}
        name: {type: string}
        quantity: {type: integer}
        unit_price: {type: string, example: "35.50"}
    Budget:
      type: object
      properties:
        id: {type: string}
        service_order_id: {type: string}
        status: {type: string, enum: [GENERATED, CANCELLED]}
        total_amount: {type: string, example: "221.00"}
        items:
          type: array
          items: {$ref: '#/components/schemas/BudgetItem'}
        created_at: {type: string, format: date-time}
    Payment:
      type: object
      properties:
        id: {type: string}
        budget_id: {type: string}
        service_order_id: {type: string}
        amount: {type: string, example: "221.00"}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED, REFUNDED, CANCELLED]}
        provider: {type: string, enum: [internal, mercadopago], example: internal}
        created_at: {type: string, format: date-time}
        checkout_url: {type: string, description: "Mercado Pago payments only."}
        expires_at: {type: string, format: date-time, description: "Mercado Pago payments only."}
