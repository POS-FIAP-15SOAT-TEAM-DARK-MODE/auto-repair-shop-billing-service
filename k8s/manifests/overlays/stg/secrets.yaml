# External Secrets Operator materialises auto-repair-shop-stg/billing (all keys) into the Secret
# billing-service-secrets. Keys are the environment variable names.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager-billing
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: billing-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager-billing
    kind: SecretStore
  target:
    name: billing-service-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: auto-repair-shop-stg/billing
