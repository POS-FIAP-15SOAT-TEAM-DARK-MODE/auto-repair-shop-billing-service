sonar.projectKey=POS-FIAP-15SOAT-TEAM-DARK-MODE_auto-repair-shop-billing-service
sonar.organization=pos-fiap-15soat-team-dark-mode

sonar.projectName=Billing Service
sonar.projectVersion=1.0

sonar.sources=.
# Analyze Go source only — everything non-Go (k8s/, .github/, Dockerfiles, shell,
# etc.) is left out of analysis via this inclusion filter.
sonar.inclusions=**/*.go
sonar.exclusions=**/*_test.go,**/mocks/**,migrations/**,docs/**,tmp/**,cmd/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out

sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.e2.ruleKey=*
sonar.issue.ignore.multicriteria.e2.resourceKey=**/mocks/**

# onStart opens the transaction and hands it over in the context. UnitOfWork.Execute commits it
# (onSuccess) or rolls it back (onFailure), also when a step panics, so S8168 does not apply here.
sonar.issue.ignore.multicriteria.e3.ruleKey=godre:S8168
sonar.issue.ignore.multicriteria.e3.resourceKey=internal/pkg/uow/postgres.go
