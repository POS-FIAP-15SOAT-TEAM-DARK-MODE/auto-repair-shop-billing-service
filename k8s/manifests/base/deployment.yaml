apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  labels:
    app: billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      serviceAccountName: billing-service
      # The db-migrate Job and this Deployment are applied together with no ordering
      # guarantee; wait for the Job so the schema exists before the service starts.
      initContainers:
        - name: wait-for-migrations
          image: alpine/k8s:1.31.2
          command:
            - sh
            - -c
            - |
              until kubectl get job/billing-service-db-migrate -n "$POD_NAMESPACE" >/dev/null 2>&1; do
                echo 'waiting for the billing-service-db-migrate Job to be created...'
                sleep 2
              done
              kubectl wait --for=condition=complete --timeout=300s -n "$POD_NAMESPACE" job/billing-service-db-migrate
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      containers:
        - name: app
          # Overridden per overlay via the kustomize `images:` transformer.
          image: auto-repair-shop-billing-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: billing-service-config
            - secretRef:
                name: billing-service-secrets
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
