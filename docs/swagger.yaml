openapi: 3.0.0
info:
  title: Auto-Repair-Shop API
  version: "1.0.0"
  description: OpenAPI specification for the project. Contains the currently available route(s).
servers:
  - url: http://localhost:{PORT}
    description: Local development server
    variables:
      PORT:
        default: "8080"
        description: Port number for the server
security:
  - SessionToken: []
paths:
  /ping:
    get:
      summary: Ping the API
      description: Health check endpoint that returns a simple message.
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Successful ping
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: pong

  /v1/auth/login:
    post:
      summary: Login a user
      description: Logs in a user and returns a JWT token. Requires email and password.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginRequest"
      responses:
        "200":
          description: User logged in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_in:
                    type: integer
        "400":
          description: Invalid request body or validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/register:
    post:
      summary: Register a new user
      description: Creates a new user account. Requires name, email, password, and confirm_password.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid request body or validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/users/{id}/role:
    patch:
      summary: Update a user role
      description: Replaces all current roles of the user with a single new role. Only ADMIN users can perform this operation.
      tags:
        - Auth
      security:
        - SessionToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: User UUID
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleRequest"
      responses:
        "204":
          description: User role updated successfully
        "400":
          description: Invalid request body, empty role, or invalid role value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized (missing or invalid JWT)
        "403":
          description: Forbidden (insufficient permissions)
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/customers:
    post:
      summary: Create a customer
      description: Creates a new customer along with a linked user account and assigns the CUSTOMER role. Supports both individual (CPF) and company (CNPJ) types. Alphanumeric CNPJ format is supported (RFB 2243/2024).
      tags:
        - Customers
      security:
        - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Invalid request body or document validation failed (CPF/CNPJ)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 400
                errors:
                  - invalid CPF
        "409":
          description: CPF, CNPJ or email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 409
                error: resource already exists
        "422":
          description: Business rule violation (e.g. constraint failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 422
                error: data violates business constraints
        "500":
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 500
                error: Internal Server Error

    get:
      summary: Get customer by document
      description: Returns the customer matching the provided CPF or CNPJ document. Accepts formatted (e.g. `111.444.777-35`) or plain (`11144477735`) values.
      tags:
        - Customers
      parameters:
        - in: query
          name: document
          required: true
          schema:
            type: string
          description: CPF or CNPJ of the customer (formatted or plain digits)
          example: "111.444.777-35"
      responses:
        "200":
          description: Customer found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Missing or invalid document format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 400
                errors:
                  - document must be a valid CPF (11 digits) or CNPJ (14 characters)
        "404":
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 404
                error: customer not found
        "500":
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/customers/{id}:
    get:
      summary: Get customer by ID
      description: Returns the customer with the specified UUID.
      tags:
        - Customers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Customer UUID
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        "200":
          description: Customer found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 404
                error: customer not found
        "500":
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Update a customer
      description: Partially updates name, email and/or phone. All fields are optional — only provided fields are changed. CPF and CNPJ are immutable. Returns 204 when the customer does not exist (idempotent).
      tags:
        - Customers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Customer UUID
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
      responses:
        "200":
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "204":
          description: Customer not found (no-op)
        "400":
          description: Validation error (e.g. invalid name format, empty phone)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 400
                errors:
                  - the username must be longer than 3 characters and can only contain letters and spaces
        "409":
          description: Email already in use by another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 409
                error: resource already exists
        "500":
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete a customer
      description: Removes the customer and its associated user account in a single transaction. Returns 204 on success or when the customer does not exist (idempotent). Returns an error for business rule violations (e.g. linked service orders).
      tags:
        - Customers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Customer UUID
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        "204":
          description: Customer deleted or not found
        "409":
          description: Customer has linked service orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 409
                error: customer has associated service orders
        "500":
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/vehicles:
    get:
      summary: Get vehicle by license plate
      description: Retrieve a vehicle by its normalized license plate. The license plate must follow supported formats (old or Mercosul).
      tags:
        - Vehicle
      security:
        - SessionToken: []
      parameters:
        - in: query
          name: plate
          required: true
          schema:
            type: string
          description: License plate (supports old and Mercosul formats)
        - in: query
          name: customerId
          required: true
          schema:
            type: string
          description: customerId to search vehicles
        - in: query
          name: page
          schema:
            type: integer
            format: int64
            default: 1
            minimum: 1
          description: Page number (1-based).
        - in: query
          name: pageSize
          schema:
            type: integer
            format: int64
            default: 10
            minimum: 1
          description: Number of items per page.
      responses:
        "200":
          description: Vehicle found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponse"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: create a new vehicle register
      description: insert a new vehicle in our database
      tags:
        - Vehicle
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleRequest"
      responses:
        "201":
          description: Successful created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponse"
        "500":
          description: Internal Server Error
        "400":
          description: Invalid Body Content

  /v1/vehicles/{id}:
    put:
      summary: update a vehicle register
      description: update a vehicle in our database
      tags:
        - Vehicle
      parameters:
        - in: path
          required: true
          name: id
          schema:
            type: string
          description: Id of vehicle to be updated.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleRequest"
      responses:
        "200":
          description: Successful updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponse"
        "500":
          description: Internal Server Error
        "400":
          description: Invalid Body Content
    delete:
      summary: delete a vehicle register
      description: delete a vehicle in our database
      tags:
        - Vehicle
      parameters:
        - in: path
          required: true
          name: id
          schema:
            type: string
          description: Id of vehicle to be deleted.
      responses:
        "204":
          description: Successful deleted
        "500":
          description: Internal Server Error
        "400":
          description: Invalid Body Content

  /v1/works:
    post:
      summary: Register a new Work
      description: Endpoint to create a new work object.
      tags:
        - Work
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkRequest"
      responses:
        "201":
          description: Successful created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWorkResponse"
        "500":
          description: Internal Server Error
        "400":
          description: Invalid Body Content

    get:
      summary: List Works
      description: List registered works with pagination and optional status filter.
      tags:
        - Work
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            format: int64
            default: 1
            minimum: 1
          description: Page number (1-based).
        - in: query
          name: pageSize
          schema:
            type: integer
            format: int64
            default: 10
            minimum: 1
          description: Number of items per page.
        - in: query
          name: status
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
          description: Filter works by status.
      responses:
        "200":
          description: Successful list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListWorksResponse"
        "500":
          description: Internal Server Error

  /v1/works/{id}:
    put:
      summary: Update an existing Work
      description: Endpoint to edit an existing work object.
      tags:
        - Work
      parameters:
        - in: path
          required: true
          name: id
          schema:
            type: string
          description: Id of work to be updated.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkRequest"
      responses:
        "200":
          description: Successful updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWorkResponse"
        "500":
          description: Internal Server Error
        "400":
          description: Invalid Body Content

    delete:
      summary: Delete a Work
      description: Deletes a work by its id.
      tags:
        - Work
      parameters:
        - in: path
          required: true
          name: id
          schema:
            type: string
          description: Id of work to be deleted.
      responses:
        "204":
          description: Successful deleted
        "500":
          description: Internal Server Error

  /v1/supplies:
    post:
      summary: Create a supply
      description: Creates a new supply with name, description, unit price and stock quantity.
      tags:
        - Supply
      security:
        - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplyRequest"
      responses:
        "201":
          description: Supply created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyResponse"
        "400":
          description: Invalid request body or validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 400
                error: invalid request body
        "422":
          description: Business rule violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 422
                error: data violates business constraints
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 500
                error: Internal Server Error

    get:
      summary: List supplies
      description: Returns a paginated list of supplies with optional status filter.
      tags:
        - Supply
      security:
        - SessionToken: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            format: int64
            default: 1
            minimum: 1
          description: Page number (1-based).
        - in: query
          name: pageSize
          schema:
            type: integer
            format: int64
            default: 10
            minimum: 1
          description: Number of items per page.
        - in: query
          name: version
          schema:
            type: number
          description: Filter supplies by version.
      responses:
        "200":
          description: Supplies listed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSuppliesResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 500
                error: Internal Server Error

  /v1/supplies/{id}:
    put:
      summary: Update a supply
      description: Updates an existing supply by ID.
      tags:
        - Supply
      security:
        - SessionToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Supply UUID
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplyRequest"
      responses:
        "200":
          description: Supply updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyResponse"
        "400":
          description: Invalid request body or validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 400
                error: invalid request body
        "422":
          description: Business rule violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 422
                error: data violates business constraints
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 500
                error: Internal Server Error

    delete:
      summary: Delete a supply
      description: Removes a supply by ID. Returns 204 on success.
      tags:
        - Supply
      security:
        - SessionToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Supply UUID
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        "204":
          description: Supply deleted successfully
        "400":
          description: Missing or invalid supply ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 400
                error: invalid supply id
        "404":
          description: Supply not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 500
                error: Internal Server Error

  /v1/service-order:
    post:
      summary: Create a new service order
      description: Create a new service order for a given customer and vehicle
      tags:
        - ServiceOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceOrderRequest"
      responses:
        "201":
          description: Service order successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateServiceOrderResponse"
        "400":
          description: Invalid Body Content
        "401":
          description: Unauthorized (missing or invalid JWT)
        "403":
          description: Forbidden (insufficient permissions)
        "422":
          description: Business rule violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
    get:
      summary: List service orders
      description: List service orders with pagination and optional filters by status, customer and vehicle.
      tags:
        - ServiceOrder
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            format: int64
            default: 1
            minimum: 1
          description: Page number (1-based).
        - in: query
          name: pageSize
          schema:
            type: integer
            format: int64
            default: 10
            minimum: 1
          description: Number of items per page.
        - in: query
          name: status
          schema:
            type: string
            enum: [NEW, RECEIVED, IN_DIAGNOSIS, AWAITING_APPROVAL, REJECTED, IN_PROGRESS, COMPLETED, DELIVERED, CANCELLED]
          description: Filter by service order status.
        - in: query
          name: customerId
          schema:
            type: string
          description: Filter by customer id.
        - in: query
          name: vehicleId
          schema:
            type: string
          description: Filter by vehicle id.
      responses:
        "200":
          description: Successful list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServiceOrdersResponse"
        "401":
          description: Unauthorized (missing or invalid JWT)
        "403":
          description: Forbidden (insufficient permissions)
        "500":
          description: Internal Server Error

  /v1/service-order/{id}:
    get:
      summary: Get service order detail
      description: Returns the full information for the specified service order.
      tags:
        - ServiceOrder
      security:
        - SessionToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Service order id
      responses:
        "200":
          description: Informations retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrderDetails"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized (missing or invalid JWT)
        "403":
          description: Forbidden (insufficient permissions)
        "404":
          description: Service order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error

  /v1/service-order/{id}/status:
    get:
      summary: Get service order status
      description: Returns the status of the service order informed without auth
      tags:
        - ServiceOrder
      security: []
      parameters:
        - in: path
          required: true
          name: id
          schema:
            type: string
          description: Id of service order.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrderStatusResponse"
        "500":
          description: Internal Server Error
        "400":
          description: Invalid Body Content

  /v1/service-order/{id}/history:
    get:
      summary: Get service order history
      description: Returns the full history of status transitions for the specified service order.
      tags:
        - ServiceOrder
      security:
        - SessionToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Service order id
      responses:
        "200":
          description: History retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkOrderHistoryEntry"
              example:
                - previous_status: ""
                  new_status: RECEIVED
                  created_at: "2026-04-13T14:34:37.026Z"
                - previous_status: AWAITING_APPROVAL
                  new_status: IN_PROGRESS
                  created_at: "2026-04-16T14:34:37.026Z"
                  work_transitions:
                    - work_id: eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee
                      status:
                        - previous_status: ""
                          new_status: NEW
                          created_at: "2026-04-15T14:34:37.026Z"
                        - previous_status: NEW
                          new_status: IN_PROGRESS
                          created_at: "2026-04-16T14:34:37.026Z"
                - previous_status: IN_PROGRESS
                  new_status: COMPLETED
                  created_at: "2026-04-17T14:34:37.026Z"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized (missing or invalid JWT)
        "403":
          description: Forbidden (insufficient permissions)
        "404":
          description: Service order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error

  /v1/service-order/{id}/works:
    get:
      summary: Get all works of a service order
      description: Get all works of a service order by its id
      tags:
        - ServiceOrder
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Id of service order to get all work from.
      responses:
        "200":
          description: Works successfully fetched
          content:
            application/json:
              schema:
