  /v1/service-order/{id}/work/{workId}/next:
    put:
      summary: Advance work status
      description: Advances the status of a work item within a service order.
      tags:
        - ServiceOrder
      security:
        - SessionToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Service order ID
        - in: path
          name: workId
          required: true
          schema:
            type: string
          description: Work ID
      responses:
        "204":
          description: Work status advanced successfully
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized (missing or invalid JWT)
        "403":
          description: Forbidden (insufficient permissions)
        "404":
          description: Work has no history in this service order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Work is already completed or in an invalid state for this transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error

  /v1/service-order/{id}/work/{workId}/cancel:
    put:
      summary: Cancel a work item
      description: Cancels a work item within a service order.
      tags:
        - ServiceOrder
      security:
        - SessionToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Service order ID
        - in: path
          name: workId
          required: true
          schema:
            type: string
          description: Work ID
      responses:
        "204":
          description: Work cancelled successfully
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized (missing or invalid JWT)
        "403":
          description: Forbidden (insufficient permissions)
        "404":
          description: Work has no history in this service order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Work is already completed or cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error

  /v1/reports/average-execution-time:
    get:
      summary: Get average work execution time
      description: Returns the average execution time in hours for individual works (billable services), calculated as the mean time between each work's IN_PROGRESS and COMPLETED status transitions across all service orders.
      tags:
        - Reports
      security:
        - SessionToken: []
      parameters:
        - in: query
          name: work_id
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Filter by one or more work IDs. Repeat the parameter for multiple values (?work_id=id1&work_id=id2). Omit to return all works.
          example: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      responses:
        "200":
          description: List of works with their average execution time. Empty array when no works have been completed yet.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkExecutionTimeResponse"
              example:
                - workId: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                  workName: Troca de óleo
                  averageExecutionTimeHours: 1.5
                - workId: yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy
                  workName: Revisão de freios
                  averageExecutionTimeHours: 3.2
        "401":
          description: Unauthorized (missing or invalid JWT)
        "403":
          description: Forbidden (insufficient permissions)
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    SessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserRegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - confirmPassword
      properties:
        name:
          type: string
          description: Full name of the user
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          format: password
          description: User password
        confirmPassword:
          type: string
          format: password
          description: Password confirmation (must match password)

    UserLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          format: password
          description: User password

    UpdateUserRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          description: New role to be assigned to the user
          enum:
            - ADMIN
            - ATTENDANT
            - MECHANIC
            - CUSTOMER
          example: MECHANIC

    UserLoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
        expires_in:
          type: integer
          description: Token expiration duration
        user:
          $ref: "#/components/schemas/UserResponse"

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
        name:
          type: string
          description: Full name of the user
        email:
          type: string
          format: email
          description: User email address

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: integer
          description: HTTP status code
        errors:
          type: array
          items:
            type: string
          description: List of validation/business error messages

    WorkExecutionTimeResponse:
      type: object
      properties:
        workId:
          type: string
          format: uuid
          description: Work identifier
        workName:
          type: string
          description: Name of the billable service
        averageExecutionTimeHours:
          type: number
          format: double
          description: Average time in hours for this work to go from IN_PROGRESS to COMPLETED across all service orders

    CreateCustomerRequest:
      type: object
      required:
        - name
        - email
        - password
        - type
        - document
        - phone
      properties:
        name:
          type: string
          example: João Silva
        email:
          type: string
          format: email
          example: joao@example.com
        password:
          type: string
          minLength: 8
          example: Secret@123
        type:
          type: string
          enum: [INDIVIDUAL, COMPANY]
          example: INDIVIDUAL
        document:
          type: string
          description: CPF (e.g. 111.444.777-35) for INDIVIDUAL or CNPJ (e.g. 11.222.333/0001-81) for COMPANY. Alphanumeric CNPJ is also accepted (e.g. AB.CDE.FGH/0001-95).
          example: "111.444.777-35"
        companyName:
          type: string
          description: Required when type is COMPANY.
          example: Empresa SA
        phone:
          type: string
          example: "11999999999"

    CustomerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        name:
          type: string
          example: João Silva
        email:
          type: string
          example: joao@example.com
        type:
          type: string
          enum: [INDIVIDUAL, COMPANY]
          example: INDIVIDUAL
        document:
          type: string
          description: Sanitized CPF (11 digits) for INDIVIDUAL or CNPJ (14 chars) for COMPANY
          example: "11144477735"
        company_name:
          type: string
          example: ""
        phone:
          type: string
          example: "11999999999"

    UpdateCustomerRequest:
      type: object
      description: All fields are optional. Only provided fields are updated.
      properties:
        name:
          type: string
          description: Full name (min 3 chars, letters and spaces only)
          example: Novo Nome
        email:
          type: string
          format: email
          example: novo@example.com
        phone:
          type: string
          example: "11888888888"

    CreateWorkRequest:
      type: object
      properties:
        name:
          type: string
          description: Work name
          example: Alinhamento
        description:
          type: string
          description: Description of the work being provided
          example: Alinhamento completo das rodas do veículo
        price:
          type: string
          description: Price as string, decimal allowed, no thousands separator
          example: "199.00"
        status:
          type: string
          description: Status of the work. Must be a valid work status enum string.
          example: ACTIVE
      required:
        - name
        - description
        - price
        - status

    CreateWorkResponse:
      type: object
      properties:
        id:
          type: string
          description: Work ID
          example: 272e933f-273e-4ef7-a38d-2ab1dd8c234c
        name:
          type: string
          description: Work name
          example: Alinhamento
        description:
          type: string
          description: Description of the work being provided
          example: Alinhamento completo das rodas do veículo
        price:
          type: string
          description: Price as string, decimal allowed, no thousands separator
          example: "199.00"
        status:
          type: string
          description: Status of the work. Must be a valid work status enum string.
          example: ACTIVE
      required:
        - id
        - name
        - description
        - price
        - status

    ListWorksResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateWorkResponse"
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int64
        page:
          type: integer
          format: int64
      required:
        - items
        - totalItems
        - totalPages
        - pageSize
        - page

    WorkStatusEntry:
      type: object
      description: A single status transition for one work.
      properties:
        previous_status:
          type: string
          example: NEW
        new_status:
          type: string
          example: IN_PROGRESS
        created_at:
          type: string
          format: date-time
          example: "2026-04-16T14:34:37.026Z"
      required:
        - previous_status
        - new_status
        - created_at

    WorkTransitionGroup:
      type: object
      description: Full status history for a single work, grouped by work_id.
      properties:
        work_id:
          type: string
          format: uuid
          example: eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee
        status:
          type: array
          description: All status transitions for this work, ordered by created_at ascending.
          items:
            $ref: "#/components/schemas/WorkStatusEntry"
      required:
        - work_id
        - status

    WorkOrderHistoryEntry:
      type: object
      properties:
        previous_status:
          type: string
          example: RECEIVED
        new_status:
          type: string
          example: IN_DIAGNOSIS
        created_at:
          type: string
          format: date-time
          example: "2026-04-05T12:34:56Z"
        work_transitions:
          type: array
          description: Present only when `new_status` is `IN_PROGRESS`. Contains the full status history for each work attached to the service order, grouped by `work_id`.
          items:
            $ref: "#/components/schemas/WorkTransitionGroup"
      required:
        - previous_status
        - new_status
        - created_at

    VehicleRequest:
      type: object
      required:
        - brand
        - licensePlate
        - customerId
        - model
        - year
      properties:
        brand:
          type: string
          example: chevrolet
        licensePlate:
          type: string
          example: aaa-2a22
        customerId:
          type: string
          format: uuid
          example: b8415e84-730a-4624-a1c3-74cf59b95d6d
        model:
          type: string
          example: onix
        year:
          type: integer
          example: 2019

    VehicleResponse:
      type: object
      required:
        - id
        - licensePlate
        - brandModel
        - year
        - customerId
      properties:
        id:
          type: string
          format: uuid
          example: 55160da4-d243-4920-9426-5ce97aefb2fc
        licensePlate:
          type: string
          example: AAA2A22
        brandModel:
          type: string
          example: chevrolet - onix
        year:
          type: integer
          example: 2019
        customerId:
          type: string
          format: uuid
          example: b8415e84-730a-4624-a1c3-74cf59b95d6d

    ListVehiclesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VehicleResponse"
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int64
        page:
          type: integer
          format: int64
      required:
        - items
        - totalItems
        - totalPages
        - pageSize
        - page

    SupplyRequest:
      type: object
      required:
        - name
        - description
        - unitPrice
        - stockQuantity
      properties:
        name:
          type: string
          minLength: 3
          description: Supply name (min 3 characters)
          example: Brake Pad
        description:
          type: string
          minLength: 10
          description: Supply description (min 10 characters)
          example: High performance brake pad
        unitPrice:
          type: string
          description: Unit price as decimal string
          example: "49.99"
        stockQuantity:
